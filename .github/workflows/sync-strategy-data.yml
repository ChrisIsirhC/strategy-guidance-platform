name: 更新策略日表

on:
  schedule:
    # GitHub Actions cron is best-effort. Wake every 15 minutes so a delayed
    # 08:00 / 18:00 task is caught up quickly; cloud_sync.py performs the
    # China-time slot de-duplication, so Tencent Docs is still checked only
    # once per scheduled slot.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 同步并重建展示数据
        run: python cloud_sync.py
      - name: 提交发生变化的数据包
        run: |
          if git diff --quiet -- site/site-data.json data/cloud_history data/cloud_sync_state.json; then
            echo "No source change."
            exit 0
          fi
          git config user.name "strategy-guidance-bot"
          git config user.email "strategy-guidance-bot@users.noreply.github.com"
          git add site/site-data.json data/cloud_history data/cloud_sync_state.json
          git commit -m "chore: refresh strategy guidance data"
          git push
