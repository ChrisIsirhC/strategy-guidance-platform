<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #f7f1ef; }
      #strategy-frame { display: block; width: 100%; height: 100%; min-height: 100vh; border: 0; opacity: 1; transition: opacity .2s ease; }
      body.is-loading #strategy-frame { opacity: 0; }
      #frame-loader { display: none; position: absolute; inset: 0; place-items: center; color: #791d24; font: 500 13px system-ui, sans-serif; }
      body.is-loading #frame-loader { display: grid; }
      #frame-loader span { display: flex; align-items: center; gap: 12px; }
      #frame-loader span::before { content: ''; width: 16px; height: 16px; border: 2px solid #e6bfc3; border-top-color: #b3262d; border-radius: 50%; animation: turn .8s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #strategy-frame { transition: none; } #frame-loader span::before { animation: none; } }
    </style>
  </head>
  <body class="is-loading">
    <div id="frame-loader" role="status"><span>正在载入策略指引</span></div>
    <iframe id="strategy-frame" title="策略指引"></iframe>
    <script>
      (() => {
        const frame = document.getElementById('strategy-frame');
        const parent = window.parent;
        const bridge = message => parent.postMessage({ isStreamlitMessage: true, ...message }, '*');
        let documentSource = null;
        let currentRoute = null;
        let currentPayload = null;
        let sentPayload = null;
        const deliverPayload = force => {
          if (!frame.contentWindow || !currentPayload) return;
          const signature = JSON.stringify(currentPayload);
          if (!force && signature === sentPayload) return;
          sentPayload = signature;
          frame.contentWindow.postMessage({ type: 'strategy:data', payload: currentPayload }, '*');
        };
        const deliverRoute = () => {
          if (!frame.contentWindow || !currentRoute) return;
          frame.contentWindow.postMessage({ type: 'strategy:route', route: currentRoute }, '*');
        };
        frame.addEventListener('load', () => {
          deliverPayload(true);
          deliverRoute();
          document.body.classList.remove('is-loading');
        });

        // This document is a real Streamlit custom component.  The page is
        // rendered in a child iframe so its long history timeline can report
        // its height without becoming a second scrolling surface.
        window.addEventListener('message', event => {
          const message = event.data || {};
          if (event.source === frame.contentWindow && message.type === 'streamlit:setFrameHeight') {
            bridge({ type: 'streamlit:setFrameHeight', height: message.height });
            return;
          }
          if (event.source === frame.contentWindow && message.type === 'strategy:navigate' && /^\/(?:$|archive(?:\?|$)|cases(?:\?|$))/.test(message.path || '')) {
            bridge({ type: 'streamlit:setComponentValue', value: message.path });
            return;
          }
          if (message.type === 'streamlit:render' && message.args && typeof message.args.document === 'string') {
            currentRoute = message.args.route || {view: 'today'};
            currentPayload = message.args.payload || null;
            if (documentSource !== message.args.document) {
              documentSource = message.args.document;
              document.body.classList.add('is-loading');
              frame.srcdoc = documentSource;
            } else {
              deliverPayload(false);
              deliverRoute();
            }
          }
        });

        bridge({ type: 'streamlit:componentReady', apiVersion: 1 });
      })();
    </script>
  </body>
</html>
